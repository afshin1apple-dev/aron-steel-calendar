name: Steel Bot

on:
  workflow_dispatch:

  schedule:

    # 15:00 Iran = 11:30 UTC
    # جمعه اجرا نمی‌شود

    - cron: "30 11 * * 0-3,5-6"


jobs:

  steel:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.12"


      - name: Install dependencies
        run: |
          pip install -r requirements.txt


      - name: Check Pillow
        run: |
          python -c "from PIL import Image, ImageDraw, ImageFont; print('Pillow OK')"


      - name: Run Steel Bot

        env:

          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}

          PRIVATE_CHAT_ID: ${{ secrets.PRIVATE_CHAT_ID }}

          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

        run: |

          echo "======================================"

          echo "Starting Steel Bot"

          echo "UTC time:"
          date -u

          echo "Iran time:"
          TZ=Asia/Tehran date

          echo "======================================"

          python steel_bot.py

          echo "======================================"

          echo "Steel Bot finished"

          echo "======================================"
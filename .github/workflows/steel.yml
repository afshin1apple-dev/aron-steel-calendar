name: Steel Bot

on:
  workflow_dispatch:

  schedule:
    # 15:00 Iran time
    # 11:30 UTC
    # Every day except Friday
    - cron: "30 11 * * 0-3,5-6"


jobs:

  steel:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 lxml

      - name: Run Steel Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          PRIVATE_CHAT_ID: ${{ secrets.PRIVATE_CHAT_ID }}
        run: |
          echo "======================================"
          echo "Starting Steel Bot"
          echo "UTC time:"
          date -u
          echo "Iran time:"
          TZ=Asia/Tehran date
          echo "======================================"

          python steel_bot.py

          echo "======================================"
          echo "Steel Bot finished"
          echo "======================================"
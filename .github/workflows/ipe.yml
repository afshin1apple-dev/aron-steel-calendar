name: IPE Bot
on:
  workflow_dispatch:
  schedule:
    # =====================================================
    # IPE PRICE BOT
    #
    # فقط یک بار در روز
    # 14:00 ایران = 10:30 UTC
    #
    # روزهای اجرا:
    # شنبه، یکشنبه، دوشنبه، سه‌شنبه، چهارشنبه، پنجشنبه
    #
    # جمعه اجرا نمی‌شود.
    # =====================================================
    - cron: "30 10 * * 0-4,6"
jobs:
  ipe:
    runs-on: ubuntu-latest
    steps:
      # =====================================================
      # CHECKOUT
      # =====================================================
      - name: Checkout
        uses: actions/checkout@v4
      # =====================================================
      # SETUP PYTHON
      # =====================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # =====================================================
      # INSTALL DEPENDENCIES
      # =====================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      # =====================================================
      # CHECK PILLOW
      # =====================================================
      - name: Check Pillow
        run: |
          python -c "from PIL import Image, ImageDraw, ImageFont; print('Pillow OK')"
      # =====================================================
      # RUN IPE BOT
      # =====================================================
      - name: Run IPE Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          echo "======================================"
          echo "Starting IPE Bot"
          echo "======================================"
          echo "UTC time:"
          date -u
          echo "Iran time:"
          TZ=Asia/Tehran date
          echo "======================================"
          python ipe.py
          echo "======================================"
          echo "IPE Bot finished"
          echo "======================================"
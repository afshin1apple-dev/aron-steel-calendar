name: IPE Bot
on:
  workflow_dispatch:
  schedule:
    # 13:30 Iran time
    # 10:00 UTC
    # Every day except Friday
    - cron: "0 10 * * 0-3,5-6"
jobs:
  ipe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      - name: Check Pillow
        run: |
          python -c "from PIL import Image, ImageDraw, ImageFont; print('Pillow OK')"
      - name: Run IPE Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          PRIVATE_CHAT_ID: ${{ secrets.PRIVATE_CHAT_ID }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          echo "======================================"
          echo "Starting IPE Bot"
          echo "UTC time:"
          date -u
          echo "Iran time:"
          TZ=Asia/Tehran date
          echo "======================================"
          python ipe.py
          echo "======================================"
          echo "IPE Bot finished"
          echo "======================================"
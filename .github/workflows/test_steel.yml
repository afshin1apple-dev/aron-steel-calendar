name: Test Steel Prices

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: |
          pip install requests

      - name: Run steel test
        run: |
          python test_steel.py

      - name: Show prices.json
        run: |
          echo "=============================="
          echo "PRICES JSON"
          echo "=============================="
          cat prices.json